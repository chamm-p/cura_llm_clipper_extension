<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>cura Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="kopf">
      <!-- Logo + Name oeffnen cura. In JEDER Ansicht erreichbar, auch wenn
           noch nichts eingerichtet oder gerade ein Fehler zu sehen ist. -->
      <button id="btn-cura-oeffnen" class="marke-knopf">
        <img src="../icons/icon-32.png" alt="" class="logo" />
        <span class="marke" data-t="marke">cura Clipper</span>
      </button>
      <button id="btn-einstellungen" class="ikon-knopf" data-t-title="einstellungen">⚙</button>
    </header>

    <!-- Nicht eingerichtet: URL/Key fehlen -->
    <section id="ansicht-setup" class="ansicht" hidden>
      <p class="hinweis" data-t="setupHinweis"></p>
      <button id="btn-zu-einstellungen" class="primaer" data-t="setupKnopf"></button>
    </section>

    <!-- Ziel-Auswahl (erstes Mal oder "Ziel aendern") -->
    <section id="ansicht-ziel" class="ansicht" hidden>
      <p class="hinweis" id="ziel-einleitung"></p>

      <label class="feld">
        <span data-t="zielLabel"></span>
        <select id="wahl-wiki"></select>
      </label>

      <label class="feld" id="feld-section">
        <span data-t="sectionLabel"></span>
        <input id="wahl-section" list="section-vorschlaege" data-t-platzhalter="allgemein" />
        <datalist id="section-vorschlaege"></datalist>
      </label>

      <div class="knopf-reihe">
        <button id="btn-ziel-speichern" class="primaer" data-t="merkenWeiter"></button>
        <button id="btn-ziel-abbrechen" class="sekundaer" data-t="abbrechen" hidden></button>
      </div>
    </section>

    <!-- Normalfall: ablegen -->
    <section id="ansicht-ablage" class="ansicht" hidden>
      <div class="seite-info">
        <div class="seite-titel" id="seite-titel">…</div>
        <div class="seite-url" id="seite-url"></div>
      </div>

      <div class="ziel-zeile">
        <span class="ziel-text">→ <strong id="ziel-anzeige"></strong></span>
        <button id="btn-ziel-aendern" class="link-knopf" data-t="zielAendern"></button>
      </div>

      <button id="btn-ablegen" class="primaer gross" data-t="ablegenKnopf"></button>
      <p class="fuss" id="erfassungs-info"></p>
    </section>

    <!-- Status: laufend / Erfolg / Fehler -->
    <section id="ansicht-status" class="ansicht" hidden>
      <div id="status-spinner" class="spinner" hidden></div>
      <p id="status-text" class="status-text"></p>
      <div class="knopf-reihe">
        <button id="btn-status-zurueck" class="sekundaer" data-t="zurueck" hidden></button>
        <button id="btn-seite-oeffnen" class="primaer" hidden></button>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
