<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Cura_llm — Einstellungen</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="huelle">
      <header class="kopf">
        <img src="../icons/icon-48.png" alt="" class="logo" />
        <div>
          <h1 data-t="marke"></h1>
          <p class="unterzeile" data-t="optUnterzeile"></p>
        </div>
      </header>

      <section class="karte">
        <h2 data-t="optSprache"></h2>
        <label class="feld">
          <select id="f-sprache">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
          <small data-t="optSpracheHilfe"></small>
        </label>
      </section>

      <section class="karte">
        <h2 data-t="optVerbindung"></h2>

        <label class="feld">
          <span data-t="optAdresse"></span>
          <input id="f-url" type="url" placeholder="https://cura.example.com" spellcheck="false" />
          <small data-t="optAdresseHilfe"></small>
        </label>

        <label class="feld">
          <span data-t="optKey"></span>
          <input id="f-key" type="password" placeholder="sk-gw-…" spellcheck="false" autocomplete="off" />
          <small data-t="optKeyHilfe"></small>
        </label>

        <label class="feld">
          <span data-t="optWorkspace"></span>
          <input id="f-ws" spellcheck="false" />
          <small data-t="optWorkspaceHilfe"></small>
        </label>

        <div class="knopf-reihe">
          <button id="btn-test" class="sekundaer" data-t="optTesten"></button>
          <span id="test-ergebnis" class="ergebnis"></span>
        </div>
      </section>

      <section class="karte">
        <h2 data-t="optZiel"></h2>
        <p class="hinweis" data-t="optZielHinweis"></p>

        <label class="feld">
          <span data-t="zielLabel"></span>
          <select id="f-wiki"><option value="" data-t="optNochNicht"></option></select>
          <small data-t="optZielHilfe"></small>
        </label>

        <label class="feld" id="f-feld-section">
          <span data-t="sectionLabel"></span>
          <input id="f-section" list="f-section-liste" data-t-platzhalter="allgemein" />
          <datalist id="f-section-liste"></datalist>
          <small data-t="optSectionHilfe"></small>
        </label>

        <button id="btn-wikis-laden" class="sekundaer" data-t="optZieleLaden"></button>
      </section>

      <div class="fussleiste">
        <button id="btn-speichern" class="primaer" data-t="optSpeichern"></button>
        <span id="speicher-ergebnis" class="ergebnis"></span>
      </div>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
